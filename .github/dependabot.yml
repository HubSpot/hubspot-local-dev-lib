version: 2
updates:
  # Root library package. A committed yarn.lock lets Dependabot see the full
  # transitive graph, so security and version updates cover nested deps, not
  # just direct ones.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Wait before proposing newly published versions; a fresh release can be
    # malicious or unstable (supply-chain hardening).
    cooldown:
      default-days: 7
    groups:
      hubspot-libraries:
        patterns:
          - "@hubspot/*"
      minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "@hubspot/*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
