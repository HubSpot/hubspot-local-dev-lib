name: Fresh install check

# Validates that a clean install from package.json alone still builds and passes
# tests, resolving the latest range-compatible dependency versions a fresh
# install would. Runs daily so a breaking upstream release surfaces here quickly
# instead of in consumers of this library. This is a smoke test only: it never
# commits or opens a PR. Dependabot handles advancing the committed lockfile.

on:
  schedule:
    - cron: "0 13 * * *" # Daily 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install with a freshly resolved dependency tree
        run: |
          rm -f yarn.lock
          yarn install --non-interactive

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test
