name: Release

# Publishes whenever main has a package.json version that isn't on npm yet.
# Release PRs are opened by `yarn release` and `yarn beta-release`; merging one
# lands the version bump on main and triggers this workflow.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should-publish: ${{ steps.check.outputs.should-publish }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      current-latest: ${{ steps.check.outputs.current-latest }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for an unpublished version
        id: check
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          if npm view "$PACKAGE_NAME@$VERSION" version --silent >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$VERSION is already published, nothing to do"
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            TAG=next
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TAG=latest
          else
            echo "::error::Version $VERSION is neither a beta nor a stable release. Experimental releases are published locally with \`yarn release -t experimental\`."
            exit 1
          fi

          echo "Publishing $PACKAGE_NAME@$VERSION to $TAG"
          {
            echo "should-publish=true"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "current-latest=$(npm view "$PACKAGE_NAME" dist-tags.latest)"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: check
    if: needs.check.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.tag }}
      CURRENT_LATEST: ${{ needs.check.outputs.current-latest }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) requires npm >= 11.5.1
      - run: npm install -g npm@11.6.2

      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn test

      - name: Publish to npm
        working-directory: dist
        run: npm publish --tag "$TAG" --provenance

      - name: Tag release commit
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

      # Trusted publishing only authenticates `npm publish`, so dist-tag
      # updates still need a token
      - name: Update dist-tags
        if: needs.check.outputs.tag == 'latest'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_DIST_TAG_TOKEN }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          npm dist-tag add "$PACKAGE_NAME@$VERSION" next
          if [ "${VERSION%%.*}" != "${CURRENT_LATEST%%.*}" ]; then
            npm dist-tag add "$PACKAGE_NAME@$CURRENT_LATEST" previous
          fi

      - name: Create GitHub release
        if: needs.check.outputs.tag == 'latest'
        run: gh release create "v$VERSION" --generate-notes --latest
