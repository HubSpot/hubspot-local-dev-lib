name: Experimental Release

# Dispatched by `yarn experimental-release`. The workflow always runs from
# main and builds the requested branch in a job without publish rights, so
# branch code can't change how or what gets published.
run-name: 'Experimental release ${{ inputs.branch }}@${{ inputs.sha }}'

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release'
        required: true
        type: string
      sha:
        description: 'Full commit SHA on that branch'
        required: true
        type: string

concurrency:
  group: experimental-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      package-name: ${{ steps.compute.outputs.package-name }}
    steps:
      - name: Require dispatch from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Experimental releases must be dispatched from main (got $GITHUB_REF)"
          exit 1

      - name: Validate inputs
        env:
          BRANCH: ${{ inputs.branch }}
          SHA: ${{ inputs.sha }}
        run: |
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full 40-character commit SHA"
            exit 1
          fi
          if [ "$BRANCH" = "main" ]; then
            echo "::error::Experimental releases cannot be published from $BRANCH"
            exit 1
          fi

      # Checks out main (the dispatch ref), so the version comes from main's
      # @hubspot/npm-scripts, the same code `yarn experimental-release` uses.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x

      - run: yarn install --frozen-lockfile

      - name: Compute experimental version
        id: compute
        run: |
          VERSION=$(yarn -s tsx ./scripts/experimental-version.ts)
          echo "Next experimental version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package-name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify commit is on the branch
        env:
          BRANCH: ${{ inputs.branch }}
          SHA: ${{ inputs.sha }}
        run: |
          if ! git merge-base --is-ancestor "$SHA" "origin/$BRANCH"; then
            echo "::error::$SHA is not on branch $BRANCH"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x

      - run: yarn install --frozen-lockfile
      - run: npm version "$VERSION" --no-git-tag-version
      - run: yarn build

      - name: Pack
        working-directory: dist
        run: npm pack --pack-destination ..

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package
          path: '*.tgz'
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PACKAGE_NAME: ${{ needs.version.outputs.package-name }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) requires npm >= 11.5.1
      - run: npm install -g npm@11.21.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: package

      - name: Verify package contents
        run: |
          TARBALL=$(ls ./*.tgz)
          MANIFEST=$(tar -xOzf "$TARBALL" package/package.json)
          NAME=$(echo "$MANIFEST" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')
          PACKED_VERSION=$(echo "$MANIFEST" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          if [ "$NAME" != "$PACKAGE_NAME" ] || [ "$PACKED_VERSION" != "$VERSION" ]; then
            echo "::error::Expected $PACKAGE_NAME@$VERSION but the tarball contains $NAME@$PACKED_VERSION"
            exit 1
          fi

      # --ignore-scripts so lifecycle scripts from branch code don't run with
      # publish credentials.
      - name: Publish to npm
        run: npm publish ./*.tgz --tag experimental --ignore-scripts --provenance

      - name: Record version
        run: |
          echo "$VERSION" > version.txt
          echo "Published \`$PACKAGE_NAME@$VERSION\` on the experimental tag" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: experimental-version
          path: version.txt
