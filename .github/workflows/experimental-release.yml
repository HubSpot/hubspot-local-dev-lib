name: Experimental Release

# Dispatched by `yarn experimental-release`. The workflow always runs from
# main and builds the requested branch in a job without publish rights, so
# branch code can't change how or what gets published.
run-name: 'Experimental release ${{ inputs.branch }}@${{ inputs.sha }}'

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release'
        required: true
        type: string
      sha:
        description: 'Full commit SHA on that branch'
        required: true
        type: string

concurrency:
  group: experimental-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - name: Require dispatch from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Experimental releases must be dispatched from main (got $GITHUB_REF)"
          exit 1

      - name: Validate inputs
        env:
          BRANCH: ${{ inputs.branch }}
          SHA: ${{ inputs.sha }}
        run: |
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full 40-character commit SHA"
            exit 1
          fi
          if [ "$BRANCH" = "main" ]; then
            echo "::error::Experimental releases cannot be published from main"
            exit 1
          fi

      - name: Compute experimental version
        id: compute
        env:
          PACKAGE_NAME: '@hubspot/local-dev-lib'
        run: |
          LATEST=$(npm view "$PACKAGE_NAME" dist-tags.latest)
          # shellcheck disable=SC2016
          VERSION=$(npm view "$PACKAGE_NAME" versions --json | LATEST="$LATEST" node -e '
            const versions = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const prefix = `${process.env.LATEST}-experimental.`;
            const numbers = versions
              .filter(v => v.startsWith(prefix) && /^\d+$/.test(v.slice(prefix.length)))
              .map(v => Number(v.slice(prefix.length)));
            const next = numbers.length ? Math.max(...numbers) + 1 : 0;
            console.log(`${prefix}${next}`);
          ')
          echo "Next experimental version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify commit is on the branch
        env:
          BRANCH: ${{ inputs.branch }}
          SHA: ${{ inputs.sha }}
        run: |
          git fetch --no-tags origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          if ! git merge-base --is-ancestor "$SHA" "origin/$BRANCH"; then
            echo "::error::$SHA is not on branch $BRANCH"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - run: yarn install --frozen-lockfile
      - run: npm version "$VERSION" --no-git-tag-version
      - run: yarn build

      - name: Pack
        working-directory: dist
        run: npm pack --pack-destination ..

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: '*.tgz'
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: npm-experimental
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PACKAGE_NAME: '@hubspot/local-dev-lib'
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) requires npm >= 11.5.1
      - run: npm install -g npm@11.6.2

      - uses: actions/download-artifact@v4
        with:
          name: package

      - name: Verify package contents
        run: |
          TARBALL=$(ls ./*.tgz)
          MANIFEST=$(tar -xOzf "$TARBALL" package/package.json)
          NAME=$(echo "$MANIFEST" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')
          PACKED_VERSION=$(echo "$MANIFEST" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          if [ "$NAME" != "$PACKAGE_NAME" ] || [ "$PACKED_VERSION" != "$VERSION" ]; then
            echo "::error::Expected $PACKAGE_NAME@$VERSION but the tarball contains $NAME@$PACKED_VERSION"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish ./*.tgz --tag experimental --ignore-scripts --provenance

      - name: Record version
        run: |
          echo "$VERSION" > version.txt
          echo "Published \`$PACKAGE_NAME@$VERSION\` on the experimental tag" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: experimental-version
          path: version.txt
